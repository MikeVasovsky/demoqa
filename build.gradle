plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "org.junit.jupiter:junit-jupiter:5.10.0",
            "com.codeborne:selenide:7.14.0",
            "com.github.javafaker:javafaker:1.0.2",
            "org.projectlombok:lombok:1.18.42"
    )
}

tasks.test {
    useJUnitPlatform()
}